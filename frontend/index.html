<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDR OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14; --bg-elev:#10151F; --bg-elev2:#161C28; --line:#1E2531; --line2:#262E3C;
  --ink:#F1F4F8; --ink2:#B8C0CC; --mute:#6B7787;
  --accent:#22E6A6; --accent-ink:#07231A; --accent-dim:rgba(34,230,166,.13);
  --blue:#3D6EF6; --blue-dim:rgba(61,110,246,.16);
  --amber:#E8A33D; --amber-dim:rgba(232,163,61,.15);
  --red:#F0554B; --red-dim:rgba(240,85,75,.15);
  --purple:#9B7DF0; --purple-dim:rgba(155,125,240,.15);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F7F9; --bg-elev:#FFFFFF; --bg-elev2:#EEF1F5; --line:#E1E5EB; --line2:#EBEEF2;
    --ink:#12161C; --ink2:#4B5566; --mute:#8A94A3;
    --accent-ink:#07231A;
  }
}
:root[data-theme="light"]{
  --bg:#F6F7F9; --bg-elev:#FFFFFF; --bg-elev2:#EEF1F5; --line:#E1E5EB; --line2:#EBEEF2;
  --ink:#12161C; --ink2:#4B5566; --mute:#8A94A3;
}
:root[data-theme="dark"]{
  --bg:#0A0E14; --bg-elev:#10151F; --bg-elev2:#161C28; --line:#1E2531; --line2:#262E3C;
  --ink:#F1F4F8; --ink2:#B8C0CC; --mute:#6B7787;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.serif{font-family:var(--serif)}
.mute{color:var(--mute)} .ink2{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}

/* Every icon renders the same way wherever it is used. Without this, an svg outside .nav/.btn/.icon-btn falls back to
   the browser default (solid black fill) and looks broken on dark backgrounds. */
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ...but shapes that ask for a solid fill (chart areas, the logo dot, chart labels) are not outlined */
svg [fill]:not([fill="none"]){stroke:none}

/* dot texture: on the whole canvas, and denser inside chart cards */
.dots{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--mute) 55%,transparent) 1px, transparent 1px);
  background-size:14px 14px; mask-image:linear-gradient(135deg,#000 0%,transparent 55%);}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--bg-elev);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 22px;font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;flex:none}
.brand u{text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:1px}
.nav-label{font-size:10.5px;letter-spacing:.08em;color:var(--mute);padding:0 10px;margin:14px 0 6px}
.nav-label:first-of-type{margin-top:0}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-align:left;width:100%;font-size:13px;font-weight:500}
.nav button:hover{background:var(--bg-elev2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-dim);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;font-size:10.5px;background:var(--red);color:#fff;padding:1px 6px;border-radius:8px;font-weight:600}
.side-bottom{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.sys{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.sys .row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.sys .sub{font-size:11px;color:var(--mute);margin:2px 0 0 14px}
.sys .spend{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);font-size:11.5px}
.sys .spend b{font-weight:700}
.meter{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.me{display:flex;align-items:center;gap:10px;padding:2px 4px}
.side-collapse{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;font-weight:500;width:100%}
.side-collapse:hover{background:var(--bg-elev2);color:var(--ink)}
.side-collapse svg{width:16px;height:16px;flex:none}
.app.collapsed .side-collapse svg{transform:rotate(180deg)}
/* icon-only sidebar */
.app.collapsed{grid-template-columns:68px 1fr}
.app.collapsed .side{padding:18px 8px;align-items:center}
.app.collapsed .brand{padding:2px 0 22px;justify-content:center}
.app.collapsed .brand u,.app.collapsed .nav-label,.app.collapsed .nav button>span:not(.badge),.app.collapsed .sys .txt,
.app.collapsed .sys .spend,.app.collapsed .me .txt,.app.collapsed .side-collapse .lbl{display:none}
.app.collapsed .nav,.app.collapsed .side-bottom{width:100%}
.app.collapsed .nav button{justify-content:center;position:relative;padding:9px 0}
.app.collapsed .nav .badge{position:absolute;top:1px;right:6px;margin:0;padding:0 5px}
.app.collapsed .sys{padding:10px;display:flex;justify-content:center}
.app.collapsed .sys .row{gap:0}
.app.collapsed .me,.app.collapsed .side-collapse{justify-content:center}

.main{min-width:0;display:flex;flex-direction:column;
  background-image:radial-gradient(color-mix(in srgb,var(--mute) 32%,transparent) 1px,transparent 1px);background-size:16px 16px}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:310px;color:var(--mute);background:var(--bg-elev)}
.search input{border:0;background:none;outline:0;flex:1;color:var(--ink);min-width:0;font-size:13px}
.search kbd{font:inherit;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg-elev2);flex:none}
.ind{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.ind .dot{color:var(--accent)} .ind.warn .dot{color:var(--amber)} .ind.bad .dot{color:var(--red)}
@media (max-width:1100px){.ind{display:none}}
a.li{display:inline-flex;align-items:center;color:var(--mute);flex:none}
a.li:hover{color:var(--blue)}
a.li svg{width:14px;height:14px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--bg-elev2)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kill{display:flex;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;background:var(--bg-elev)}
.kill:hover{background:var(--red-dim)}
.kill.on{background:var(--red);color:#fff}
.content{flex:1;padding:26px 28px 60px;max-width:1400px;width:100%}
h1.page-t{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-.01em}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--bg-elev2)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{opacity:.92}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.accent:hover{opacity:.9}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-dim)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-elev2)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* cards */
.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-b{padding:18px;position:relative}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.5fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(2,1fr)} .g2{grid-template-columns:1fr}}
@media (max-width:640px){.g6,.g4,.g3{grid-template-columns:repeat(2,1fr)} .app{grid-template-columns:1fr} .side{display:none} .content{padding:18px}}

/* kpi */
.kpi{padding:16px 17px}
.kpi .v{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.kpi .l{color:var(--mute);font-size:12px;margin-top:5px}
.kpi .d{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);margin-top:9px;font-weight:600}
.kpi .d svg{width:11px;height:11px}

/* badges/pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg-elev2);color:var(--ink2)}
.pill.live{background:var(--accent-dim);color:var(--accent)} .pill.paused{background:var(--amber-dim);color:var(--amber)}
.pill.draft{background:var(--bg-elev2);color:var(--mute)} .pill.done{background:var(--blue-dim);color:var(--blue)}
.pill.archived{background:var(--bg-elev2);color:var(--mute)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,230,166,.4)}70%{box-shadow:0 0 0 5px rgba(34,230,166,0)}100%{box-shadow:0 0 0 0 rgba(34,230,166,0)}}
.tag{font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:6px;display:inline-block}
.tag.red{background:var(--red-dim);color:var(--red)} .tag.green{background:var(--accent-dim);color:var(--accent)}
.tag.amber{background:var(--amber-dim);color:var(--amber)} .tag.purple{background:var(--purple-dim);color:var(--purple)}

/* chart */
.chart-wrap{position:relative;height:190px}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:20px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.bars .b i{display:block;width:100%;max-width:52px;background:var(--blue);border-radius:5px 5px 0 0;position:relative}
.bars .b:nth-child(2) i{background:#2F52C4} .bars .b:nth-child(3) i{background:#233A8C}
.bars .b span.v{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:700}
.bars .b .l{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.3}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;text-transform:none}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--bg-elev2)}
.scroll{overflow-x:auto}
.avatar{width:26px;height:26px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff}

/* agent health bar */
.health{display:flex;gap:3px}
.health i{flex:1;height:5px;border-radius:3px;background:var(--accent)}
.health i.off{background:var(--line2)}

/* filters/tabs */
.filters{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.filters button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg-elev);font-size:12px;font-weight:600;color:var(--ink2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tabs button{padding:9px 4px;margin-right:20px;color:var(--mute);border-bottom:2px solid transparent;font-size:13px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;color:var(--mute);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);color:var(--ink);font:inherit}
.field textarea{resize:vertical;min-height:80px;font-family:ui-monospace,monospace;font-size:12px}
.row-sw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line2)}
.row-sw:last-child{border-bottom:0}
.sw{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:.15s}
.sw[aria-checked="true"]{background:var(--accent-dim)}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--accent)}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;max-width:480px;width:100%;padding:22px}
.modal h2{font-family:var(--serif);font-size:19px;margin-bottom:8px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.stoplist{background:var(--bg);border-radius:10px;padding:4px 14px;margin:14px 0;font-size:12.5px}
.stoplist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)}
.stoplist div:last-child{border-bottom:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--bg-elev);border-left:1px solid var(--line);z-index:50;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px 20px}
.sec{margin-bottom:20px}
.sec h4{font-size:11px;color:var(--mute);text-transform:none;font-weight:700;margin-bottom:8px;letter-spacing:.02em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:13px}

/* diff view */
.diff-add{background:var(--accent-dim);color:var(--accent)} .diff-rem{background:var(--red-dim);color:var(--red);text-decoration:line-through}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 14px;font-size:12.5px}
.kv dt{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ================= ICONS ================= */
const I={

 help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/>',
 account:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 bell:'<path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', chev:'<path d="M9 6l6 6-6 6"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>', check:'<path d="M5 12l5 5 9-10"/>',
 email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 linkedin:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v6M8 7.5v.01M12 17v-6M12 13.5c0-3 5-3 5 0V17"/>',

const API=new URLSearchParams(location.search).get('api')||'';
async function api(method,path,body){
  let res;
  try{res=await fetch(API+path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}
  catch(_){throw new Error(location.protocol==='file:'?'Open this page through the backend (npm start, then http://localhost:3000)':'Cannot reach the backend')}
  let j=null;try{j=await res.json()}catch(_){}
  if(!res.ok){const e=new Error((j&&(j.error||(j.blocked&&'Blocked: '+j.reason)))||`Request failed (${res.status})`);e.status=res.status;throw e}
  return j;
}
// List endpoints return at most 500 rows per request, so read them in pages.
async function apiAll(path){
  const out=[];
  for(let off=0;;off+=500){
    const page=await api('GET',`${path}${path.includes('?')?'&':'?'}limit=500&offset=${off}`);
    out.push(...page);
    if(page.length<500)return out;
  }
}
function ago(iso){
  if(!iso)return '—';
  const s=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));
  if(s<60)return s+'s ago';
  const m=Math.floor(s/60);if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';

    :(icp.size||'-');
  return {roles:arr(icp.roles),industries:arr(cc.industries||icp.industries),geo:arr(icp.geo).join(', ')||'-',size};
}

function dayBuckets(rows,getDate,days=12){
  const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(days-1)),pts=Array(days).fill(0);
  for(const r of rows){const d=new Date(getDate(r)),i=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/864e5);if(i>=0&&i<days)pts[i]++}
  const labels=[0,2,4,6,8,10].map(i=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
  return {pts,labels};
}
function monthBuckets(rows,getDate,n=12){
  const now=new Date(),pts=Array(n).fill(0);
  for(const r of rows){const d=new Date(getDate(r)),i=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth()+(n-1);if(i>=0&&i<n)pts[i]++}
  const labels=[0,2,4,6,8,10].map(i=>new Date(now.getFullYear(),now.getMonth()-(n-1)+i,1).toLocaleDateString('en-US',{month:'short'}));
  return {pts,labels};
}

function globalCost(){

}

function overview(){
  const live=CAMPAIGNS.filter(c=>c.status==='live').length;
  const totalPros=CAMPAIGNS.reduce((a,c)=>a+c.pros,0);
  const totalCont=CAMPAIGNS.reduce((a,c)=>a+c.cont,0);
  const totalMeet=CAMPAIGNS.reduce((a,c)=>a+c.meet,0);
  const totalOpp=CAMPAIGNS.reduce((a,c)=>a+c.opp,0);
  const ids=CAMPAIGNS.map(c=>c.id),today=new Date().toDateString();
  const addedToday=PROS.filter(p=>new Date(p.raw.created_at).toDateString()===today).length;
  const sentToday=dispatches(ids).filter(a=>new Date(a.created_at).toDateString()===today).length;
  const kpis=[[totalPros.toLocaleString(),'Prospects in pipeline',`+${addedToday} today`],[totalCont,'Contacted',`${sentToday} dispatched today`],
    [`${live} of ${CAMPAIGNS.length}`,'Campaigns live',`${CAMPAIGNS.filter(c=>c.status==='paused').length} paused, ${CAMPAIGNS.filter(c=>c.status==='draft').length} draft`],
    [TASKS.length,'Needs attention','pending approvals'],[totalMeet,'Meetings booked',`${S.meetings.filter(m=>m.scheduled_at).length} with a time set`],[totalOpp,'Qualified opportunities',`of ${totalPros} prospects`]];
  const growth=monthBuckets(PROS,p=>p.raw.created_at);
  return shell(`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px">
    <div><h1 class="page-t">Good morning</h1><p class="mute" style="margin-top:4px">Here's what your agents did while you were away.</p></div>
    <button class="btn accent" data-nav="campaigns">${ic('plus',14)} New campaign</button></div>
  <div class="grid g6" style="margin-bottom:16px">${kpis.map(([v,l,d])=>`<div class="card kpi"><div class="v num">${v}</div><div class="l">${l}</div><div class="d">${ic('up')}${d}</div></div>`).join('')}</div>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h3>Prospects, last 12 months</h3></div><div class="card-b"><div class="dots"></div>${sparkChart(growth.pts,growth.labels)}</div></section>
    <section class="card"><div class="card-h"><h3>Meetings booked, per campaign</h3></div><div class="card-b">${barChart(CAMPAIGNS.filter(c=>c.status!=='draft').map(c=>[c.name,c.meet]))}</div></section>
  </div>
  <section class="card" style="margin-top:14px"><div class="card-h"><h3>Live agent activity</h3><span class="pill live"><span class="dot pulse-true"></span>Streaming</span></div>
  ${feedRows(FEED,true)}
  </section>`);
}
function feedRows(items,withAge){
  if(!items.length)return '<div class="empty">No agent activity yet.</div>';
  return items.map(e=>`<div style="display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:center">
    <div style="width:32px;height:32px;border-radius:9px;background:var(--bg-elev2);display:grid;place-items:center;color:var(--ink2)">${ic(agent(e.a)?.icon||'bolt',15)}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px">${esc(e.t)}</div><div class="mute" style="font-size:11.5px;margin-top:1px">${esc(agent(e.a)?.name||(e.a==='dispatch'?'Dispatch':e.a))} · ${esc(e.s)}</div></div>
    <div class="mute num" style="font-size:11.5px">${ago(e.at)}</div></div>`).join('');
}
function sparkChart(pts,labels){
  const max=Math.max(...pts,1),w=560,h=150,step=w/(pts.length-1);
  const path=pts.map((p,i)=>`${i?'L':'M'}${i*step},${h-(p/max)*h+10}`).join(' ');
  const area=path+` L${w},${h+10} L0,${h+10} Z`;
  return `<svg viewBox="0 0 ${w} ${h+30}" style="width:100%;height:190px" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${labels.map((m,i)=>`<text x="${i*(w/(labels.length-1))}" y="${h+26}" font-size="10" fill="var(--mute)" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${esc(m)}</text>`).join('')}
  </svg>`;
}
function barChart(rows){
  const max=Math.max(...rows.map(r=>r[1]),1);
  return `<div class="bars">${rows.map(([l,v])=>`<div class="b"><i style="height:${Math.max((v/max)*110,6)}px"><span class="v">${v}</span></i><div class="l">${esc(l)}</div></div>`).join('')}</div>`;
}

// Working hours as stored in reps.working_hours (free-form jsonb). Understands { start, end, timezone, days } and a
// per-day map like { mon: "9-17" }; anything else is shown compactly rather than hidden.
function fmtHours(h){
  if(!h||typeof h!=='object'||Array.isArray(h)||!Object.keys(h).length)return 'Not set';
  const tz=h.timezone||h.tz;
  if(h.start&&h.end){
    const days=Array.isArray(h.days)&&h.days.length?`${h.days.join(', ')} `:'';
    return `${days}${h.start}–${h.end}${tz?' '+tz:''}`;
  }
  const parts=Object.entries(h).filter(([k])=>k!=='timezone'&&k!=='tz').map(([k,v])=>{
    const val=v&&typeof v==='object'?`${v.start??''}–${v.end??''}`:String(v);
    return `${k.slice(0,1).toUpperCase()+k.slice(1,3)} ${val}`;
  });
  return parts.join(', ')+(tz?` (${tz})`:'');
}

/* ================= EVENTS ================= */
// Runs an async action once at a time; any failure is shown as a toast with the backend's message.
async function act(fn){
  if(S.busy)return;S.busy=true;
  try{await fn()}catch(e){toast(e.message||'Something went wrong')}finally{S.busy=false}
}
async function setStatus(id,status,msg){setCampaign(await api('PATCH',`/campaigns/${id}/status`,{status}));toast(msg);render()}
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return; // real links (e.g. a prospect's LinkedIn) must not also trigger the row they sit in
  const t=e.target.closest('[data-nav],[data-act],[data-open-camp],[data-pause-camp],[data-resume-camp],[data-launch],[data-filter],[data-ctab],[data-ctabv],[data-pro],[data-cagent],[data-cchan],[data-gchan],[data-pview],[data-task],[data-psel]');
  if(!t||t.disabled) return; const d=t.dataset;
  if(d.gchan)return act(async()=>{
    // { channel: false } pauses it, { channel: true } resumes it; the backend merges, so other channels are untouched.
    const wasPaused=chanPaused(d.gchan);
    S.gchan=(await api('PATCH','/global-settings/channels',{[d.gchan]:wasPaused})).channels;
    toast(`${chName(d.gchan)} ${wasPaused?'resumed':'paused'} for all campaigns`);render();
  });
  if(d.nav) return go(d.nav);
  if(d.openCamp){S.page='campaigns';S.campId=d.openCamp;S.campTab='Overview';render();return refreshCamp(d.openCamp,'Overview')}
  if(d.pauseCamp){S.modal={t:'pause',id:d.pauseCamp};return render()}
  if(d.resumeCamp)return act(()=>setStatus(d.resumeCamp,'live',camp(d.resumeCamp).name+' resumed'));
  if(d.launch)return act(()=>setStatus(d.launch,'live',camp(d.launch).name+' launched'));
  if(d.filter){S.campFilter=d.filter;return render()}
  if(d.ctab){S.campTab=d.ctab;if(d.ctab==='Prompts')S.promptView=null;render();return refreshCamp(S.campId,d.ctab)}
  if(d.ctabv){S.convTab=d.ctabv;return render()}
  if(d.pro){S.page='prospects';S.pid=d.pro;return render()}
  if(d.cagent)return act(async()=>{
    const c=camp(d.camp),wasPaused=c.enabled_agents?.[d.cagent]===false;
    // The backend merges enabled_agents, so only this agent changes.
    setCampaign(await api('PATCH',`/campaigns/${c.id}`,{enabled_agents:{[d.cagent]:wasPaused}}));
    toast(`${agent(d.cagent).name} ${wasPaused?'resumed':'paused'} for ${c.name}`);render();
  });
  if(d.cchan)return act(async()=>{
    const c=camp(d.camp),k=d.cchan,cc=c.channel_config||{},on=!cc[k]?.enabled;
    setCampaign(await api('PATCH',`/campaigns/${c.id}`,{channel_config:{...cc,[k]:{...(cc[k]||{}),enabled:on}}}));
    toast(chName(k)+(on?' enabled':' disabled')+' for '+c.name);render();
  });
  if(d.pview){S.promptView=+d.pview;return render()}
  if(d.psel){/* select handled on change */}
  if(d.task)return act(async()=>{
    const tk=TASKS.find(x=>x.id===d.task);if(!tk)return;
    await api('PATCH',`/approvals/${tk.id}`,{status:d.do==='Approve'?'approved':'rejected',resolved_by:'dashboard'});
    TASKS=TASKS.filter(x=>x.id!==tk.id);rebuildAll();
    toast(`${d.do==='Approve'?'Approved':'Rejected'}: ${tk.who}`);render();
  });
  const a=d.act;
  if(a==='theme'){const cur=document.documentElement.dataset.theme||'dark';const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('sdr-theme',next)}catch(_){}return render()}
  if(a==='retry')return boot();
  if(a==='collapse'){S.collapsed=!S.collapsed;try{localStorage.setItem('sdr-collapsed',S.collapsed?'1':'0')}catch(_){}return render()}
  if(a==='kill'){S.modal={t:'kill'};return render()}
  if(a==='kill-confirm')return act(async()=>{
    const r=await api('PATCH','/global-settings/kill-switch',{kill_switch_on:!S.killed});
    S.killed=!!r.kill_switch_on;S.modal=null;rebuildAll();toast(S.killed?'Kill switch activated':'System resumed');render();
  });
  if(a==='pause-confirm')return act(async()=>{S.modal=null;await setStatus(d.id,'paused',camp(d.id).name+' paused')});
  if(a==='close-modal'){S.modal=null;return render()}
  if(a==='close-drawer'){S.drawer=null;return render()}
  if(a==='new-camp'){S.modal={t:'new'};return render()}
  if(a==='new-confirm')return act(async()=>{
    const name=document.getElementById('nn').value.trim();
    if(!name)return toast('Give the campaign a name');
    const description=document.getElementById('ni').value.trim();
    setCampaign(await api('POST','/campaigns',{name,description:description||undefined,status:'draft'}));
    S.modal=null;toast('Draft created');render();
  });
  if(a==='dup')return act(async()=>{
    const c=camp(d.id);
    setCampaign(await api('POST','/campaigns',{name:c.name+' (copy)',description:c.description||undefined,owner:c.owner||undefined,status:'draft',
      icp_json:c.icp_json,channel_config:c.channel_config,daily_limits:c.daily_limits,sample_profiles:c.sample_profiles}));
    toast('Duplicated as a draft: '+c.name+' (copy)');render();
  });
  if(a==='back-camps'){S.campId=null;return render()}
  if(a==='back-pros'){S.pid=null;return render()}
  if(a==='agent-logs'){S.drawer={id:d.id};return render()}
  if(a==='new-prompt-version'){S.modal={t:'prompt'};return render()}
  if(a==='prompt-confirm')return act(async()=>{
    const content=document.getElementById('pc').value.trim(),changed_by=document.getElementById('pb').value.trim();
    if(!content||!changed_by)return toast('Guidance and your name are both required');
    const v=await api('POST',`/campaigns/${S.campId}/prompt-versions`,{agent_type:S.promptSel,content,changed_by});
    await loadPrompts(S.campId,S.promptSel);
    S.modal=null;S.promptView=v.version;toast(`Saved version ${v.version}. Activate it to use it.`);render();
  });
  if(a==='activate-prompt')return act(async()=>{
    const v=await api('PATCH',`/campaigns/${S.campId}/prompt-versions/${d.id}/activate`);
    await loadPrompts(S.campId,S.promptSel);
    S.promptView=v.version;toast(`Version ${v.version} is now active`);render();
  });
  if(a==='rep-toggle')return act(async()=>{
    const r=await api('PATCH',`/reps/${d.id}`,{active:d.active!=='1'});
    await loadReps();toast(`${r.name} ${r.active?'reactivated':'offboarded'}`);render();
  });
  if(a==='supp-add')return act(async()=>{
    const el=document.getElementById('supp'),value=el.value.trim();
    if(!value)return toast('Enter an email or domain');
    await api('POST','/suppression-list',{value,reason:'Added from dashboard',scope:'global'});
    await loadSuppression();el.value='';toast(`${value.toLowerCase()} added to the suppression list`);render();
  });
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='psel'){S.promptSel=e.target.value;S.promptView=null;render();refreshCamp(S.campId,'Prompts')}
});
// ⌘K / Ctrl+K focuses the search box.
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('gsearch')?.focus()}
});
// Sidebar health and spend refresh every 30s, redrawing only if they changed.
setInterval(async()=>{
  if(document.hidden||!S.ready||S.busy)return;
  const before=JSON.stringify([S.health,S.spend]);
  await Promise.all([loadHealth(),loadSpend()]);
  if(JSON.stringify([S.health,S.spend])!==before)render();
},30000);
// Live feed: quietly re-poll the overview and the open campaign every 15s and redraw only if something changed.
const sig=()=>S.killed+'|'+TASKS.length+'|'+Object.values(S.acts).map(a=>a[0]?.id).join()+'|'+Object.values(S.cps).map(a=>a.map(c=>c.updated_at).join()).join();
setInterval(async()=>{
  if(document.hidden||!S.ready||S.busy)return;
  const onCamp=S.page==='campaigns'&&S.campId&&['Overview','Prospects','Activity'].includes(S.campTab);
  if(S.page!=='overview'&&!onCamp)return;
  const before=sig(),page=S.page;
  try{
    if(page==='overview')await Promise.all([loadKill(),loadApprovals(),...CAMPAIGNS.map(c=>loadCampData(c.id))]);
    else await Promise.all([loadKill(),loadCampData(S.campId)]);
    if(S.page!==page||sig()===before)return;
    rebuildAll();render();
  }catch(_){/* transient; the next tick retries */}
},15000);
try{document.documentElement.dataset.theme=localStorage.getItem('sdr-theme')||'dark'}catch(_){document.documentElement.dataset.theme='dark'}
boot();
</script>
</body>
</html>
